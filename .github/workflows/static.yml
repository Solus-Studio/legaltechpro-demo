name: Deploy Legal Technology demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Extract the verified static files
        run: |
          echo '42c4bfc7ba9264ec5e938afd35280abe46f9e882f3cf93afb81729386f68e1a8  legaltechpro-pages-static.zip' | sha256sum --check
          unzip -q legaltechpro-pages-static.zip -d _site
          test -f _site/.nojekyll
          test -f _site/404.html
          test -f _site/en/index.html
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: _site
          include-hidden-files: true
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..15}; do
            sleep 4
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
          done
          echo 'GitHub Actions did not list the uploaded Pages artifact within 60 seconds.' >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
